name: Daily Car Inventory Scraper

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  PYTHON_SCRIPT_NAME: processor.py # Adjust this if your Python script has a different name

jobs:
  scrape_and_report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Read previous inventory or initialize empty
      id: read_previous_inventory
      run: |
        if [ -f "${{ env.CAR_DATA_FILE }}" ]; then
          PREVIOUS_CARS=$(cat ${{ env.CAR_DATA_FILE }})
        else
          PREVIOUS_CARS="[]"
        fi
        echo "previous_cars_json=$PREVIOUS_OUTPUT"
      env:
        CAR_DATA_FILE: car_inventory.json # Use the CAR_DATA_FILE constant from your script

    - name: Run inventory scraper script
      id: run_scraper
      run: |
        # Pass the previous_cars_json as a command-line argument to the Python script
        # The script's JSON output will be captured
        OUTPUT=$(python ${{ env.PYTHON_SCRIPT_NAME }} \
          '${{ steps.read_previous_inventory.outputs.previous_cars_json }}')
        
        echo "$OUTPUT" > script_output.json
        echo "Current inventory and diff report generated."

    - name: Parse script output
      id: parse_output
      run: |
        CURRENT_INVENTORY=$(jq -c '.current_inventory' script_output.json)
        DIFF_REPORT=$(jq -r '.diff_report' script_output.json)
        
        echo "current_inventory_json=$CURRENT_INVENTORY" >> "$GITHUB_OUTPUT"
        echo "diff_report_str=$DIFF_REPORT" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Save current inventory to file
      run: |
        echo '${{ steps.parse_output.outputs.current_inventory_json }}' > car_inventory.json

    - name: Commit and push changes if any
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add car_inventory.json
        git diff --quiet --exit-code || \
          (git commit -m "Update car inventory" && git push)

    - name: Send Discord notification (if changes detected)
      if: contains(steps.parse_output.outputs.diff_report_str, '--- Inventory Change Report') && !contains(steps.parse_output.outputs.diff_report_str, 'No changes detected')
      uses: tsickert/discord-webhook@v3.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
        content: "**Car Inventory Update Detected!**\n\n```\n${{ steps.parse_output.outputs.diff_report_str }}\n```"
