name: Ruperts Scrape Scheduler

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 00:00 UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Execute Script and Save Outputs
        run: |
          # Run script with existing inventory as previous_cars if it exists, and capture JSON stdout
          if [ -f car_inventory.json ]; then
            python processor.py car_inventory.json > script_output.json
          else
            python processor.py > script_output.json
          fi
          
          # Extract current inventory and diff report into respective files using python's built-in json tool
          python -c "import json; data=json.load(open('script_output.json')); json.dump(data['current_inventory'], open('car_inventory.json', 'w'), indent=4)"
          python -c "import json; data=json.load(open('script_output.json')); open('diff_report.txt', 'w').write(data['diff_report'])"
          rm script_output.json

      - name: Read Diff Report
        id: read_report
        run: |
          echo "REPORT_CONTENT<<EOF_DIST_REPORT" >> $GITHUB_ENV
          cat diff_report.txt >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF_DIST_REPORT" >> $GITHUB_ENV

      - name: Upload Report to Discord
        # Post the report's content directly to the chat channel
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            ${{ env.REPORT_CONTENT }}

      - name: Commit and Push Data Products
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add car_inventory.json diff_report.txt

          if git diff --staged --quiet; then
            echo "No data changes detected today. Skipping push."
          else
            git commit -m "Automated inventory sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin HEAD:${{ github.ref_name }}
          fi
