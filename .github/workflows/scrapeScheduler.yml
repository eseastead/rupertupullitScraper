name: Daily Car Inventory Scraper

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  PYTHON_SCRIPT_NAME: processor.py # Adjust this if your Python script has a different name

jobs:
  scrape_and_report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4
        # jq is needed for parsing JSON output from the script
        sudo apt-get update && sudo apt-get install -y jq

    - name: Read previous inventory or initialize empty
      id: read_previous_inventory
      run: |
        TEMP_FILE="previous_inventory_temp.json"
        if [ -f "${{ env.CAR_DATA_FILE }}" ]; then
          echo "Reading existing ${{ env.CAR_DATA_FILE }} for previous inventory."
          cat ${{ env.CAR_DATA_FILE }} > "$TEMP_FILE"
        else
          echo "${{ env.CAR_DATA_FILE }} not found. Initializing empty inventory."
          echo "[]" > "$TEMP_FILE"
        fi
        echo "previous_cars_filepath=$TEMP_FILE" >> "$GITHUB_OUTPUT"
        echo "Previous inventory prepared in $TEMP_FILE"
      env:
        CAR_DATA_FILE: car_inventory.json # Use the CAR_DATA_FILE constant from your script

    - name: Run inventory scraper script
      id: run_scraper
      run: |
        echo "Running Python script with previous inventory from: ${{ steps.read_previous_inventory.outputs.previous_cars_filepath }}"
        # Pass the filepath to the previous inventory as a command-line argument
        # The script's JSON output will be captured
        OUTPUT=$(python ${{ env.PYTHON_SCRIPT_NAME }} \
          '${{ steps.read_previous_inventory.outputs.previous_cars_filepath }}')
        
        echo "$OUTPUT" > script_output.json
        echo "Current inventory and diff report generated."

    - name: Clean up temporary previous inventory file
      run: |
        TEMP_FILE="previous_inventory_temp.json"
        if [ -f "$TEMP_FILE" ]; then
          rm "$TEMP_FILE"
          echo "Cleaned up $TEMP_FILE"
        fi

    - name: Parse script output
      id: parse_output
      run: |
        CURRENT_INVENTORY=$(jq -c '.current_inventory' script_output.json)
        DIFF_REPORT=$(jq -r '.diff_report' script_output.json)
        
        echo "current_inventory_json=$CURRENT_INVENTORY" >> "$GITHUB_OUTPUT"
        echo "diff_report_str<<EOF" >> "$GITHUB_OUTPUT"
        echo "$DIFF_REPORT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Format Discord message
      id: format_discord_message
      run: |
        DIFF_REPORT_RAW="${{ steps.parse_output.outputs.diff_report_str }}"
        
        # Initialize an empty array for formatted lines
        declare -a FORMATTED_LINES
        
        # Process header
        HEADER=$(echo "$DIFF_REPORT_RAW" | grep '^REPORT_HEADER:' | sed 's/^REPORT_HEADER: //')
        if [ -n "$HEADER" ]; then
          FORMATTED_LINES+=("### $HEADER")
        fi

        # Process new cars
        ADDED_COUNT=$(echo "$DIFF_REPORT_RAW" | grep '^ADDED_COUNT:' | sed 's/^ADDED_COUNT: //')
        if [ -n "$ADDED_COUNT" ] && [ "$ADDED_COUNT" -gt 0 ]; then
          FORMATTED_LINES+=("") # Blank line for spacing
          FORMATTED_LINES+=("**New Cars Added: $ADDED_COUNT**")
          echo "$DIFF_REPORT_RAW" | grep '^ADDED_ITEM:' | sed 's/^ADDED_ITEM: /- **+** /' | while read -r line; do
            FORMATTED_LINES+=("$line")
          done
        fi

        # Process removed cars
        REMOVED_COUNT=$(echo "$DIFF_REPORT_RAW" | grep '^REMOVED_COUNT:' | sed 's/^REMOVED_COUNT: //')
        if [ -n "$REMOVED_COUNT" ] && [ "$REMOVED_COUNT" -gt 0 ]; then
          FORMATTED_LINES+=("") # Blank line for spacing
          FORMATTED_LINES+=("**Cars Removed: $REMOVED_COUNT**")
          echo "$DIFF_REPORT_RAW" | grep '^REMOVED_ITEM:' | sed 's/^REMOVED_ITEM: /- **-** /' | while read -r line; do
            FORMATTED_LINES+=("$line")
          done
        fi

        # Process modified cars
        MODIFIED_COUNT=$(echo "$DIFF_REPORT_RAW" | grep '^MODIFIED_COUNT:' | sed 's/^MODIFIED_COUNT: //')
        if [ -n "$MODIFIED_COUNT" ] && [ "$MODIFIED_COUNT" -gt 0 ]; then
          FORMATTED_LINES+=("") # Blank line for spacing
          FORMATTED_LINES+=("**Cars Modified: $MODIFIED_COUNT**")
          CURRENT_MODIFIED_ITEM=""
          echo "$DIFF_REPORT_RAW" | while read -r line; do
            if [[ "$line" =~ ^MODIFIED_ITEM: ]]; then
              FORMATTED_LINES+=("- **~** $(echo "$line" | sed 's/^MODIFIED_ITEM: //')")
            elif [[ "$line" =~ ^MODIFIED_DETAIL: ]]; then
              DETAIL_LINE=$(echo "$line" | sed -E 's/^MODIFIED_DETAIL:[[:space:]]+([^:]+): (.+) -> (.+)/  - *\1*: Changed from `\2` to `\3`/')
              FORMATTED_LINES+=("$DETAIL_LINE")
            fi
          done
        fi

        # Process no changes
        NO_CHANGES=$(echo "$DIFF_REPORT_RAW" | grep '^NO_CHANGES:' | sed 's/^NO_CHANGES: //')
        if [ -n "$NO_CHANGES" ]; then
          FORMATTED_LINES+=("") # Blank line for spacing
          FORMATTED_LINES+=("*$NO_CHANGES*")
        fi

        # Process initial load
        INITIAL_LOAD=$(echo "$DIFF_REPORT_RAW" | grep '^INITIAL_LOAD:' | sed 's/^INITIAL_LOAD: //')
        if [ -n "$INITIAL_LOAD" ]; then
          FORMATTED_LINES+=("") # Blank line for spacing
          FORMATTED_LINES+=("### Initial Inventory Load")
          FORMATTED_LINES+=("* $INITIAL_LOAD")
        fi
        
        # Join the array elements with newline for the final message
        printf -v DISCORD_MESSAGE '%s\n' "${FORMATTED_LINES[@]}"
        
        # Output the formatted message
        echo "discord_message_content<<EOF_MSG" >> "$GITHUB_OUTPUT"
        echo -e "${DISCORD_MESSAGE}" >> "$GITHUB_OUTPUT"
        echo "EOF_MSG" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Save current inventory to file
      run: |
        echo "Saving current inventory to ${{ env.CAR_DATA_FILE }}"
        echo '${{ steps.parse_output.outputs.current_inventory_json }}' > car_inventory.json
      env:
        CAR_DATA_FILE: car_inventory.json

    - name: Commit and push changes if any
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        echo "Checking for changes in car_inventory.json..."
        if [ -f "car_inventory.json" ]; then
          echo "car_inventory.json exists locally after being written." >&2
        else
          echo "Error: car_inventory.json does NOT exist locally after being written! Cannot commit." >&2
          exit 1 # Fail the step
        fi

        git add car_inventory.json
        echo "Git add executed for car_inventory.json."

        # Check if there are any changes to commit (staged changes)
        if git diff --staged --quiet; then
          echo "No changes to commit detected by git diff --staged. Skipping commit and push."
        else
          echo "Changes detected. Attempting to commit and push..."
          git commit -m "Update car inventory"
          
          if [ $? -eq 0 ]; then # Check if commit was successful
            echo "Git commit successful. Attempting to push."
            git push
            if [ $? -eq 0 ]; then # Check if push was successful
              echo "Successfully committed and pushed car_inventory.json."
            else
              echo "Error: Git push failed. Check repository permissions or token scopes." >&2
              exit 1 # Fail the step
            fi
          else
            echo "Error: Git commit failed." >&2
            exit 1 # Fail the step
          fi
        fi

    - name: Send Discord notification (if changes detected)
      if: contains(steps.parse_output.outputs.diff_report_str, 'REPORT_HEADER:') && !contains(steps.parse_output.outputs.diff_report_str, 'NO_CHANGES:')
      uses: tsickert/discord-webhook@v3.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
        content: |
          **Car Inventory Update Detected!**
          ${{ steps.format_discord_message.outputs.discord_message_content }}
