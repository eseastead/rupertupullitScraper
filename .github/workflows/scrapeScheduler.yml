name: Ruperts Scrape Scheduler

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 00:00 UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
        
      - name: Execute Script
        run: python processor.py

      - name: Send diff report to Discord
        if: ${{ hashFiles('diff_report.txt') != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ ! -s diff_report.txt ]; then
            echo "diff_report.txt is empty; skipping Discord notification."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]
          with open("diff_report.txt", "r", encoding="utf-8") as f:
              report = f.read().strip()

          if not report:
              raise SystemExit(0)

          payload = {
              "content": (
                  "**📊 Inventory Sync Report**\n"
                  "```text\n"
                  f"{report}\n"
                  "```"
              )
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(req) as response:
              response.read()
          PY

      - name: Commit and Push Data Products
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Safely stage files only if they exist
          [ -f car_inventory.json ] && git add car_inventory.json
          [ -f diff_report.txt ] && git add diff_report.txt
          
          if git diff --staged --quiet; then
            echo "No data changes detected today. Skipping push."
          else
            git commit -m "Automated inventory sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin HEAD:${{ github.ref_name }}
          fi
