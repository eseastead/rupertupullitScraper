name: Daily Car Inventory Scraper

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  PYTHON_SCRIPT_NAME: processor.py # Adjust this if your Python script has a different name

jobs:
  scrape_and_report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4
        # jq is needed for parsing JSON output from the script
        sudo apt-get update && sudo apt-get install -y jq

    - name: Read previous inventory or initialize empty
      id: read_previous_inventory
      run: |
        TEMP_FILE="previous_inventory_temp.json"
        if [ -f "${{ env.CAR_DATA_FILE }}" ]; then
          echo "Reading existing ${{ env.CAR_DATA_FILE }} for previous inventory."
          cat ${{ env.CAR_DATA_FILE }} > "$TEMP_FILE"
        else
          echo "${{ env.CAR_DATA_FILE }} not found. Initializing empty inventory."
          echo "[]" > "$TEMP_FILE"
        fi
        echo "previous_cars_filepath=$TEMP_FILE" >> "$GITHUB_OUTPUT"
        echo "Previous inventory prepared in $TEMP_FILE"
      env:
        CAR_DATA_FILE: car_inventory.json

    - name: Run inventory scraper script
      id: run_scraper
      run: |
        echo "::debug::Running Python script with previous inventory from: ${{ steps.read_previous_inventory.outputs.previous_cars_filepath }}"
        # Execute the Python script, redirecting its stdout directly to script_output.json
        python ${{ env.PYTHON_SCRIPT_NAME }} \
          '${{ steps.read_previous_inventory.outputs.previous_cars_filepath }}' > script_output.json
        echo "::debug::Python script output saved to script_output.json"

    - name: Clean up temporary previous inventory file
      run: |
        TEMP_FILE="previous_inventory_temp.json"
        if [ -f "$TEMP_FILE" ]; then
          rm "$TEMP_FILE"
          echo "Cleaned up $TEMP_FILE"
        fi

    - name: Parse script output
      id: parse_output
      run: |
        CURRENT_INVENTORY=$(jq -c '.current_inventory' script_output.json)
        echo "current_inventory_json=$CURRENT_INVENTORY" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Save current inventory to file
      run: |
        echo "Saving current inventory to ${{ env.CAR_DATA_FILE }}"
        echo '${{ steps.parse_output.outputs.current_inventory_json }}' > car_inventory.json
      env:
        CAR_DATA_FILE: car_inventory.json

    - name: Commit and push changes if any
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        echo "Checking for changes in car_inventory.json..."
        if [ -f "car_inventory.json" ]; then
          echo "car_inventory.json exists locally after being written." >&2
        else
          echo "Error: car_inventory.json does NOT exist locally after being written! Cannot commit." >&2
          exit 1
        fi

        git add car_inventory.json
        echo "Git add executed for car_inventory.json."

        if git diff --staged --quiet; then
          echo "No changes to commit detected by git diff --staged. Skipping commit and push."
        else
          echo "Changes detected. Attempting to commit and push..."
          git commit -m "Update car inventory"
          
          if [ $? -eq 0 ]; then
            echo "Git commit successful. Attempting to push."
            git push
            if [ $? -eq 0 ]; then
              echo "Successfully committed and pushed car_inventory.json."
            else
              echo "Error: Git push failed. Check repository permissions or token scopes." >&2
              exit 1
            fi
          else
            echo "Error: Git commit failed." >&2
            exit 1
          fi
        fi

    - name: Send Discord Notifications in Chunks
      run: |
        # Read the list of pre-split message chunks from the JSON file
        CHUNKS_COUNT=$(jq '.diff_report_chunks | length' script_output.json)
        echo "Total Discord message chunks to send: $CHUNKS_COUNT"
        
        for ((i=0; i<CHUNKS_COUNT; i++)); do
          # Extract the raw string of the specific index chunk
          CHUNK_CONTENT=$(jq -r ".diff_report_chunks[$i]" script_output.json)
          
          # Send each chunk using a curl POST request to the webhook
          # This avoids any issues with plugin parameters and guarantees robust delivery of chunks
          curl -H "Content-Type: application/json" \
               -d "$(jq -n --arg content "$CHUNK_CONTENT" --arg username "Rupert" '{content: $content, username: $username}')" \
               "${{ secrets.DISCORD_WEBHOOK }}"
        done
