name: Ruperts Scrape Scheduler

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 00:00 UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
        
      - name: Execute Script
        run: python processor.py

      - name: Upload Report to Discord
        if: hashFiles('diff_report.txt') != ''
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          filename: diff_report.txt

      - name: Commit and Push Data Products
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Safely stage files only if they exist
          [ -f car_inventory.json ] && git add car_inventory.json
          [ -f diff_report.txt ] && git add diff_report.txt
          
          if git diff --staged --quiet; then
            echo "No data changes detected today. Skipping push."
          else
            git commit -m "Automated inventory sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin HEAD:${{ github.ref_name }}
          fi
